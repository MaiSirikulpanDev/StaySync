services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: staysync
      POSTGRES_PASSWORD: staysync
      POSTGRES_DB: staysync
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U staysync']
      interval: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ['9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 5s
      retries: 20

  # Fake OTA for the demo: receives availability pushes, sends signed webhooks on demand.
  mock-ota:
    build:
      context: .
      target: mock-ota
    environment:
      PORT: '4000'
      APP_URL: http://api:3000
      OTA_WEBHOOK_SECRET: dev-webhook-secret
    ports: ['4000:4000']

  api:
    build: .
    ports: ['3000:3000']
    environment: &app-env
      DATABASE_URL: postgresql://staysync:staysync@postgres:5432/staysync
      KAFKA_BROKERS: kafka:19092
      API_KEY: dev-api-key
      OTA_BASE_URL: http://mock-ota:4000
      OTA_WEBHOOK_SECRET: dev-webhook-secret
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mock-ota: { condition: service_started }

  # Same image, different command: outbox publisher, both consumer groups, iCal poller.
  # Two replicas share the topic partitions; the api runs the migrations first.
  worker:
    build: .
    command: ['node', 'dist/worker']
    environment: *app-env
    deploy:
      replicas: 2
    depends_on:
      api: { condition: service_healthy }
