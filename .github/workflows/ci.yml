name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run takes about 3 minutes. Without a limit, one hung e2e run held the job for GitHub's 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # The second agent (Google ADK) has its own dependencies and tests; they need no key.
      - run: npm ci --prefix agents/adk
      - run: npm test --prefix agents/adk
